[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-compression-eval"
version = "0.1.0"
description = "Auditable three-arm evaluation of mathematical compression in Lean"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compression-eval = "lean_compression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
